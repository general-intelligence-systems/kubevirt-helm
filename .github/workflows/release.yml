name: Release Charts

# The nightly sync publishes charts in its own run (see sync.yml). This workflow
# is a manual re-publish for catch-up or repair.
on:
  workflow_dispatch:

# contents: write lets bin/package-charts push the packages and index to
# gh-pages using the built-in GITHUB_TOKEN.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Configure git
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"

      - name: Publish charts and index to gh-pages
        run: nix develop --command bin/package-charts --push
