name: Release Charts

# The nightly sync now releases charts in its own run (see sync.yml). This
# workflow is kept for manual catch-up runs and for tags pushed by a human,
# whose events -- unlike the sync's GITHUB_TOKEN pushes -- do trigger it.
on:
  push:
    tags:
      - 'v*'
      - 'cdi-v*'
  workflow_dispatch:

# contents: write lets chart-releaser publish packages and index.yaml to
# gh-pages using the built-in GITHUB_TOKEN.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"

      - name: Release charts
        uses: helm/chart-releaser-action@v1.7.0
        with:
          charts_dir: charts
          skip_existing: true
          packages_with_index: true
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
