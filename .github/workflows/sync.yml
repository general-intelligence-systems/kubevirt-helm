name: Sync KubeVirt & CDI Releases

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

# contents: write covers all three writes this job makes with the built-in
# GITHUB_TOKEN: the release-data commits, the v*/cdi-v* tags, and the chart
# packages + index.yaml that chart-releaser pushes to gh-pages.
permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Configure git
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"

      - name: Fetch releases
        run: nix develop --command bin/fetch-releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit release data
        run: |
          git add data/releases.yaml
          git diff --cached --quiet || git commit -m "chore: update release data"

      - name: Backfill new releases
        run: nix develop --command bin/backfill

      - name: Fetch CDI releases
        run: nix develop --command bin/fetch-cdi-releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit CDI release data
        run: |
          git add data/cdi-releases.yaml
          git diff --cached --quiet || git commit -m "chore: update CDI release data"

      - name: Backfill new CDI releases
        run: nix develop --command bin/backfill-cdi

      - name: Push
        run: git push origin HEAD --tags

      - uses: azure/setup-helm@v4

      # chart-releaser's own chart discovery diffs charts/ against the latest
      # git tag. This repo tags every sync, so at this point HEAD *is* the
      # latest tag and that diff is always empty ("No chart changes detected").
      # Package every chart explicitly instead and let skip_existing below make
      # already-published versions a no-op.
      - name: Package charts
        run: |
          mkdir -p .cr-release-packages
          for chart in charts/*/; do
            helm package "$chart" --destination .cr-release-packages
          done
          ls -1 .cr-release-packages

      # Runs here rather than in release.yml because tags pushed above with the
      # built-in GITHUB_TOKEN do not trigger workflow runs. Same run, same token.
      - name: Release charts
        uses: helm/chart-releaser-action@v1.7.0
        with:
          skip_packaging: true
          skip_existing: true
          packages_with_index: true
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
