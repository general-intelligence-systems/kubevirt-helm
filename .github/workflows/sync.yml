name: Sync KubeVirt & CDI Releases

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Configure git
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"

      - name: Fetch releases
        run: nix develop --command bin/fetch-releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit release data
        run: |
          git add data/releases.yaml
          git diff --cached --quiet || git commit -m "chore: update release data"

      - name: Backfill new releases
        run: nix develop --command bin/backfill

      - name: Fetch CDI releases
        run: nix develop --command bin/fetch-cdi-releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit CDI release data
        run: |
          git add data/cdi-releases.yaml
          git diff --cached --quiet || git commit -m "chore: update CDI release data"

      - name: Backfill new CDI releases
        run: nix develop --command bin/backfill-cdi

      - name: Push
        run: git push origin HEAD --tags

      - name: Create GitHub releases
        run: nix develop --command bin/create-releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
