name: Sync KubeVirt & CDI Releases

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

# contents: write covers all three writes this job makes with the built-in
# GITHUB_TOKEN: the release-data commits, the v*/cdi-v* tags, and the chart
# packages + index.yaml that chart-releaser pushes to gh-pages.
permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Configure git
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"

      - name: Fetch releases
        run: nix develop --command bin/fetch-releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit release data
        run: |
          git add data/releases.yaml
          git diff --cached --quiet || git commit -m "chore: update release data"

      - name: Backfill new releases
        run: nix develop --command bin/backfill

      - name: Fetch CDI releases
        run: nix develop --command bin/fetch-cdi-releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit CDI release data
        run: |
          git add data/cdi-releases.yaml
          git diff --cached --quiet || git commit -m "chore: update CDI release data"

      - name: Backfill new CDI releases
        run: nix develop --command bin/backfill-cdi

      - name: Push
        run: git push origin HEAD --tags

      # Publishing runs here, in the same job, because the tags pushed above are
      # pushed with the built-in GITHUB_TOKEN and GitHub does not start workflow
      # runs from GITHUB_TOKEN push events -- which is why release.yml had not
      # fired since 2026-04-12 and index.yaml was stuck at 1.8.0-rc.0.
      - name: Publish charts and index to gh-pages
        run: nix develop --command bin/package-charts --push
